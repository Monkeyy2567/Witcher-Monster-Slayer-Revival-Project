<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>นักล่าอสูรแห่งเมือง</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#16161c; --card:#22222b; --text:#efece6; --muted:#a29fa8; --gold:#e0a93f; --green:#6fcf6f; --red:#ee6a5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: system-ui, "Noto Sans Thai", sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  #hud { position:absolute; top:0; left:0; right:0; z-index:500; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:max(8px, env(safe-area-inset-top)) 12px 8px; background:rgba(22,22,28,.85); font-size:14px; }
  .bar { flex:1 1 120px; min-width:110px; height:14px; border-radius:7px; background:#0c0c10; overflow:hidden; position:relative; }
  .bar > i { display:block; height:100%; background:var(--green); transition:width .2s; }
  .bar.xp > i { background:var(--gold); }
  .bar.foe > i { background:var(--red); }
  .tag { white-space:nowrap; }
  #pad { position:absolute; left:16px; bottom:max(20px, env(safe-area-inset-bottom)); width:140px; height:140px; z-index:500; border-radius:50%;
    background:rgba(0,0,0,.45); border:3px solid rgba(224,169,63,.8); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(224,169,63,.85); pointer-events:none; }
  #dock { position:absolute; right:12px; bottom:max(20px, env(safe-area-inset-bottom)); z-index:500; display:flex; flex-direction:column; gap:8px; }
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid #3a3a46; border-radius:12px; padding:10px 14px; min-height:44px; cursor:pointer; }
  button.primary { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  button.on { outline:2px solid var(--green); }
  #toast { position:absolute; left:50%; top:90px; transform:translateX(-50%); z-index:900; background:rgba(0,0,0,.85); padding:10px 16px; border-radius:12px;
    max-width:86vw; text-align:center; display:none; }
  #modal { position:absolute; inset:0; z-index:800; display:none; background:rgba(0,0,0,.7); overflow:auto; padding:max(14px, env(safe-area-inset-top)) 14px 24px; }
  #sheet { max-width:520px; margin:0 auto; background:var(--card); border-radius:18px; padding:16px; }
  h2, h3 { margin:0 0 8px; } h3 { color:var(--gold); font-size:15px; margin-top:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .row > .grow { flex:1 1 140px; }
  .muted { color:var(--muted); font-size:13px; }
  .big { font-size:72px; text-align:center; line-height:1.1; margin:4px 0; }
  .intent { text-align:center; padding:8px; border-radius:10px; background:#2d2d3a; margin:8px 0; font-weight:600; }
  .log { font-size:13px; color:var(--muted); min-height:64px; margin:6px 0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .mk { text-align:center; font-size:30px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .mk small { display:block; font-size:11px; background:rgba(0,0,0,.7); color:#fff; border-radius:6px; padding:1px 4px; margin-top:2px; }
  .me { font-size:34px; text-align:center; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <span class="tag" id="lvTag"></span>
  <div class="bar"><i id="hpBar"></i></div><span class="tag" id="hpTag"></span>
  <div class="bar xp"><i id="xpBar"></i></div>
  <span class="tag" id="goldTag"></span>
</div>
<div id="toast"></div>
<div id="pad"><div id="knob"></div></div>
<div id="dock">
  <button id="btnBag">🎒 กระเป๋า</button>
  <button id="btnSmith">🔨 ช่างตีเหล็ก</button>
  <button id="btnGps">📍 GPS จริง: ปิด</button>
  <button id="btnHelp">❓ วิธีเล่น</button>
</div>
<div id="modal"><div id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// ───────────── ข้อมูลเกม (ตัวละครและชื่อทั้งหมดเป็นของเราเอง ใช้อีโมจิแทนรูป) ─────────────
const SAVE_KEY = 'city-hunter-save-v1';
const START = { lat: 13.7563, lng: 100.5018 };   // กรุงเทพฯ: เปลี่ยนได้ หรือกดปุ่ม GPS จริง
const CELL = 0.0025;        // ขนาดช่องแผนที่ ~270 ม.
const RANGE = 2;            // มองเห็นรอบตัวกี่ช่อง
const ENGAGE_M = 80;        // ต้องเข้าใกล้กี่เมตรถึงจะล่าได้
const SPEED = 9;            // เมตร/วินาที ตอนดันจอยสุด (เร็วกว่าเดินจริง เพื่อให้เล่นสนุก)
const RESPAWN_MS = 10 * 60 * 1000;

const PARTS = {
  head: { name: 'หัว',    acc: 0.80, mult: 1.3 },
  body: { name: 'ลำตัว',  acc: 1.00, mult: 1.0 },
  tail: { name: 'หาง',    acc: 0.90, mult: 1.1 },
};

const MONSTERS = [
  { id: 'wolf',  name: 'หมาป่าเขี้ยวเงิน', emoji: '🐺', hp: 60,  atk: 8,  weak: 'head', minLv: 1, w: 1,   parts: ['เขี้ยวหมาป่า', 'หนังหมาป่า'] },
  { id: 'boar',  name: 'หมูป่าเหล็ก',      emoji: '🐗', hp: 90,  atk: 11, weak: 'tail', minLv: 1, w: 1,   parts: ['งาหมูป่า', 'หนังหนา'] },
  { id: 'scorp', name: 'แมงป่องพิษม่วง',   emoji: '🦂', hp: 80,  atk: 10, weak: 'body', minLv: 2, w: 1,   parts: ['หางพิษ', 'กระดองม่วง'] },
  { id: 'gator', name: 'จระเข้หนองดำ',     emoji: '🐊', hp: 150, atk: 15, weak: 'head', minLv: 3, w: 1,   parts: ['เกล็ดจระเข้', 'ฟันจระเข้'] },
  { id: 'drake', name: 'มังกรเพลิงแดง',    emoji: '🐉', hp: 260, atk: 22, weak: 'head', minLv: 5, w: 0.4, parts: ['เกล็ดเพลิง', 'เขามังกร'], boss: true },
];

// kind: sword ธรรมดา / hammer มีโอกาสทำให้มอนสเตอร์มึน / bow ยิงไกล โดนโต้กลับเบาลง
const WEAPONS = {
  sword1:  { name: 'ดาบเหล็กเก่า',    kind: 'sword',  atk: 14, acc: 0.90, emoji: '🗡️' },
  hammer1: { name: 'ค้อนหิน',          kind: 'hammer', atk: 24, acc: 0.70, emoji: '🔨' },
  bow1:    { name: 'ธนูไม้',           kind: 'bow',    atk: 12, acc: 0.95, emoji: '🏹' },
  sword2:  { name: 'ดาบเขี้ยวเงิน',    kind: 'sword',  atk: 24, acc: 0.92, emoji: '🗡️' },
  hammer2: { name: 'ค้อนงาหมูป่า',     kind: 'hammer', atk: 38, acc: 0.72, emoji: '🔨' },
  bow2:    { name: 'ธนูหางพิษ',        kind: 'bow',    atk: 20, acc: 0.96, emoji: '🏹' },
  sword3:  { name: 'ดาบเพลิงมังกร',    kind: 'sword',  atk: 42, acc: 0.94, emoji: '🗡️' },
};
const ARMORS = {
  arm1: { name: 'เกราะหนังหมาป่า',   def: 0.15 },
  arm2: { name: 'เกราะกระดองม่วง',   def: 0.30 },
  arm3: { name: 'เกราะเกล็ดเพลิง',   def: 0.50 },
};
const RECIPES = [
  { id: 'sword2',  type: 'weapon', gold: 80,  cost: { 'เขี้ยวหมาป่า': 4, 'หนังหมาป่า': 2 } },
  { id: 'hammer2', type: 'weapon', gold: 150, cost: { 'งาหมูป่า': 4, 'หนังหนา': 3 } },
  { id: 'bow2',    type: 'weapon', gold: 120, cost: { 'หางพิษ': 3, 'กระดองม่วง': 2 } },
  { id: 'sword3',  type: 'weapon', gold: 400, cost: { 'เกล็ดเพลิง': 4, 'เขามังกร': 2, 'ฟันจระเข้': 2 } },
  { id: 'arm1',    type: 'armor',  gold: 60,  cost: { 'หนังหมาป่า': 4 } },
  { id: 'arm2',    type: 'armor',  gold: 200, cost: { 'กระดองม่วง': 5, 'หนังหนา': 2 } },
  { id: 'arm3',    type: 'armor',  gold: 500, cost: { 'เกล็ดเพลิง': 5, 'เกล็ดจระเข้': 3 } },
  { id: 'potion',  type: 'potion', gold: 10,  cost: { 'สมุนไพร': 2 }, name: 'ยาฟื้นพลัง 🧪' },
];

// ───────────── สถานะและการเซฟ ─────────────
const fresh = () => ({ lat: START.lat, lng: START.lng, hp: 100, lv: 1, xp: 0, gold: 50, inv: { 'สมุนไพร': 2 },
  potions: 3, owned: ['sword1', 'hammer1', 'bow1'], weapon: 'sword1', armors: [], cool: {} });
let S = fresh();
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (_) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }

const maxHp = () => 100 + (S.lv - 1) * 12;
const xpNeed = () => S.lv * 100;
const weaponOf = () => WEAPONS[S.weapon];
const armorDef = () => Math.max(0, ...S.armors.map(a => ARMORS[a].def));
const rnd = (a, b) => a + Math.random() * (b - a);

// ───────────── แผนที่ ─────────────
const $ = id => document.getElementById(id);
if (typeof L === 'undefined') {
  $('map').innerHTML = '<p style="padding:90px 20px">โหลดแผนที่ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช</p>';
  throw new Error('Leaflet missing');
}
const map = L.map('map', { zoomControl: false, attributionControl: true, minZoom: 15, maxZoom: 19 }).setView([S.lat, S.lng], 17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
const me = L.marker([S.lat, S.lng], { icon: L.divIcon({ className: '', html: '<div class="me">🧙</div>', iconSize: [36, 36], iconAnchor: [18, 18] }), zIndexOffset: 1000 }).addTo(map);

function metres(aLat, aLng, bLat, bLng) {
  const r = Math.PI / 180, dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) ** 2;
  return 6371000 * 2 * Math.asin(Math.sqrt(h));
}

// ───────────── มอนสเตอร์และสมุนไพรบนแผนที่ (สุ่มแบบคงที่ตามช่อง) ─────────────
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function cellEntities(i, j) {
  const r = mulberry32((i * 73856093) ^ (j * 19349663) ^ 0x9e3779b9);
  const n = r() < 0.3 ? 0 : r() < 0.65 ? 1 : 2, out = [];
  for (let k = 0; k < n; k++) {
    out.push({ id: `${i},${j},${k}`, lat: (i + r()) * CELL, lng: (j + r()) * CELL,
      kind: r() < 0.7 ? 'monster' : 'herb', pick: r(), lvj: r() });
  }
  return out;
}
function monsterFor(e) {
  const pool = MONSTERS.filter(m => m.minLv <= S.lv + 1);
  const total = pool.reduce((s, m) => s + m.w, 0);
  let x = e.pick * total, def = pool[0];
  for (const m of pool) { if (x < m.w) { def = m; break; } x -= m.w; }
  const lv = Math.max(1, S.lv + Math.floor(e.lvj * 3) - 1) + (def.boss ? 2 : 0);
  return { def, lv };
}
const markers = new Map();
function refreshEntities() {
  const ci = Math.floor(S.lat / CELL), cj = Math.floor(S.lng / CELL), wanted = new Map(), now = Date.now();
  for (let i = ci - RANGE; i <= ci + RANGE; i++) for (let j = cj - RANGE; j <= cj + RANGE; j++)
    for (const e of cellEntities(i, j)) {
      if (S.cool[e.id] && now - S.cool[e.id] < (e.kind === 'herb' ? 5 * 60000 : RESPAWN_MS)) continue;
      wanted.set(e.id, e);
    }
  for (const [id, m] of markers) if (!wanted.has(id)) { m.remove(); markers.delete(id); }
  for (const [id, e] of wanted) {
    let html, sig;
    if (e.kind === 'monster') { const { def, lv } = monsterFor(e); html = `<div class="mk">${def.emoji}<small>Lv${lv}</small></div>`; sig = def.id + lv; }
    else { html = '<div class="mk">🌿</div>'; sig = 'herb'; }
    const old = markers.get(id);
    if (old && old.sig === sig) continue;
    if (old) old.remove();
    const mk = L.marker([e.lat, e.lng], { icon: L.divIcon({ className: '', html, iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(map);
    mk.sig = sig;
    mk.on('click', () => engage(e));
    markers.set(id, mk);
  }
}
function engage(e) {
  const d = metres(S.lat, S.lng, e.lat, e.lng);
  if (d > ENGAGE_M) { toast(`อยู่ไกลไป อีก ${Math.round(d - ENGAGE_M)} เมตร เดินเข้าไปใกล้อีกหน่อย`); return; }
  if (e.kind === 'herb') {
    const n = 1 + (Math.random() < 0.5 ? 1 : 0);
    S.inv['สมุนไพร'] = (S.inv['สมุนไพร'] || 0) + n; S.cool[e.id] = Date.now(); save(); refreshEntities();
    toast(`เก็บสมุนไพร +${n} 🌿`); return;
  }
  startHunt(e);
}

// ───────────── การเคลื่อนที่: จอยสติ๊ก / ปุ่มลูกศร WASD / GPS ─────────────
let vx = 0, vy = 0, keyX = 0, keyY = 0, gps = false, watchId = null, dragging = false;
const pad = $('pad'), knob = $('knob');
function padMove(ev) {
  const r = pad.getBoundingClientRect(), R = r.width / 2;
  let dx = (ev.clientX - r.left - R) / R, dy = (ev.clientY - r.top - R) / R;
  const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
  const push = Math.min(1, len), s = push < 0.12 ? 0 : (push - 0.12) / 0.88 / (push || 1);
  vx = dx * s; vy = dy * s;
  knob.style.transform = `translate(${dx * R * 0.7}px, ${dy * R * 0.7}px)`;
}
function padEnd() { dragging = false; vx = vy = 0; knob.style.transform = ''; }
pad.addEventListener('pointerdown', ev => { dragging = true; pad.setPointerCapture(ev.pointerId); padMove(ev); });
pad.addEventListener('pointermove', ev => { if (dragging) padMove(ev); });
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
const held = new Set();
function keyVec() { keyX = keyY = 0; for (const k of held) { keyX += KEYS[k][0]; keyY += KEYS[k][1]; } const l = Math.hypot(keyX, keyY); if (l > 1) { keyX /= l; keyY /= l; } }
addEventListener('keydown', ev => { const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key; if (KEYS[k]) { held.add(k); keyVec(); ev.preventDefault(); } });
addEventListener('keyup', ev => { const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key; held.delete(k); keyVec(); });

$('btnGps').onclick = () => {
  if (gps) { gps = false; if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; $('btnGps').textContent = '📍 GPS จริง: ปิด'; $('btnGps').classList.remove('on'); return; }
  if (!navigator.geolocation) { toast('เครื่องนี้ไม่รองรับ GPS'); return; }
  watchId = navigator.geolocation.watchPosition(p => { S.lat = p.coords.latitude; S.lng = p.coords.longitude; place(); },
    () => { toast('เปิดสิทธิ์ตำแหน่งไม่ได้ ใช้จอยสติ๊กแทนได้'); $('btnGps').click(); }, { enableHighAccuracy: true });
  gps = true; $('btnGps').textContent = '📍 GPS จริง: เปิด'; $('btnGps').classList.add('on');
};

function place() { me.setLatLng([S.lat, S.lng]); map.setView([S.lat, S.lng], map.getZoom(), { animate: false }); }
let last = performance.now(), lastRefresh = 0, lastRegen = 0, lastSave = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!hunt && modalOpen === 0 && !gps) {
    const ux = vx || keyX, uy = vy || keyY;
    if (ux || uy) {
      S.lat -= (uy * SPEED * dt) / 111320;
      S.lng += (ux * SPEED * dt) / (111320 * Math.cos(S.lat * Math.PI / 180));
      place();
    }
  }
  if (now - lastRefresh > 500) { lastRefresh = now; refreshEntities(); }
  if (now - lastRegen > 4000 && !hunt) { lastRegen = now; if (S.hp < maxHp()) { S.hp++; hud(); } }
  if (now - lastSave > 10000) { lastSave = now; save(); }
  requestAnimationFrame(frame);
}

// ───────────── ล่ามอนสเตอร์ (แบบ Monster Hunter: เลือกโจมตีทีละส่วน อ่านท่าแล้วตอบโต้) ─────────────
let hunt = null;
function startHunt(e) {
  const { def, lv } = monsterFor(e);
  const hp = Math.round(def.hp * (1 + 0.25 * (lv - 1)));
  hunt = { id: e.id, def, lv, hp, max: hp, atk: Math.round(def.atk * (1 + 0.15 * (lv - 1))), intent: 'attack', over: false,
    parts: { head: { dmg: 0, broken: false }, body: { dmg: 0, broken: false }, tail: { dmg: 0, broken: false } },
    log: [`${def.name} Lv${lv} ปรากฏตัว!`] };
  renderHunt();
}
function nextIntent(cur) {
  if (cur === 'charge') return 'heavy';
  if (cur === 'heavy') return 'rest';
  return Math.random() < (hunt.def.boss ? 0.55 : 0.7) ? 'attack' : 'charge';
}
const INTENT_TEXT = {
  attack: '⚠️ กำลังจะโจมตี  (ป้องกัน หรือ หลบ ได้)',
  charge: '🔥 กำลังรวบรวมพลัง  (รอบหน้าจะโจมตีหนัก!)',
  heavy:  '💥 โจมตีหนัก!  (หลบไม่พ้น ป้องกันช่วยลดได้)',
  rest:   '😮‍💨 เหนื่อยหอบ เปิดช่อง!  (ดาเมจของคุณ ×1.5)',
};
function act(kind, part) {
  const h = hunt; if (!h || h.over) return;
  const w = weaponOf(), log = [];
  let guard = false, dodge = false, stunned = false;
  if (kind === 'attack') {
    const p = PARTS[part], hit = Math.random() < w.acc * p.acc;
    if (hit) {
      const weak = h.def.weak === part ? 1.5 : 1;
      const dmg = Math.round(w.atk * rnd(0.85, 1.15) * p.mult * weak * (h.intent === 'rest' ? 1.5 : 1));
      h.hp = Math.max(0, h.hp - dmg);
      const pt = h.parts[part]; pt.dmg += dmg;
      log.push(`${w.emoji} โดน${p.name}${weak > 1 ? ' (จุดอ่อน!)' : ''} -${dmg}`);
      if (!pt.broken && pt.dmg >= h.max * 0.3) { pt.broken = true; log.push(`✨ ทำลาย${p.name}สำเร็จ! ได้ของเพิ่ม`); }
      if (w.kind === 'hammer' && Math.random() < 0.25) { stunned = true; log.push('💫 ค้อนทำให้มอนสเตอร์มึนงง!'); }
    } else log.push(`${w.emoji} พลาดเป้า${p.name}`);
  } else if (kind === 'guard') { guard = true; log.push('🛡️ คุณตั้งการ์ด'); }
  else if (kind === 'dodge') { dodge = true; log.push('💨 คุณเตรียมหลบ'); }
  else if (kind === 'potion') {
    if (S.potions <= 0) { toast('ไม่มียาแล้ว (ทำที่ช่างตีเหล็กได้)'); return; }
    S.potions--; S.hp = Math.min(maxHp(), S.hp + 50); log.push('🧪 ดื่มยา +50 HP');
  } else if (kind === 'flee') {
    if (Math.random() < 0.6) { hunt = null; closeModal(); toast('หนีสำเร็จ'); return; }
    log.push('หนีไม่พ้น!');
  }
  if (h.hp <= 0) { h.over = true; return win(log); }

  if (stunned) log.push(`${h.def.name} ไม่ได้ขยับ`);
  else {
    const it = h.intent; let dmg = 0;
    if (it === 'attack') {
      dmg = h.atk * rnd(0.9, 1.1) * (h.parts.head.broken ? 0.8 : 1);
      if (w.kind === 'bow' && kind === 'attack') dmg *= 0.75;
      if (dodge) { if (Math.random() < 0.8) { dmg = 0; log.push('หลบสำเร็จ!'); } else log.push('หลบพลาด!'); }
      if (guard) dmg *= 0.4;
      if (dmg) log.push(`${h.def.emoji} โจมตีคุณ`);
    } else if (it === 'heavy') {
      dmg = h.atk * 2 * rnd(0.9, 1.1) * (h.parts.tail.broken ? 0.8 : 1);
      if (dodge) { dmg *= 0.6; log.push('หลบได้บางส่วน'); }
      if (guard) dmg *= 0.6;
      log.push(`${h.def.emoji} 💥 โจมตีหนัก!`);
    } else if (it === 'charge') log.push(`${h.def.emoji} กำลังรวบรวมพลัง...`);
    else log.push(`${h.def.emoji} เหนื่อยหอบ`);
    dmg = Math.round(dmg * (1 - armorDef()));
    if (dmg > 0) { S.hp -= dmg; log.push(`คุณเสีย ${dmg} HP`); }
  }
  h.intent = nextIntent(h.intent);
  if (S.hp <= 0) { h.over = true; return lose(log); }
  h.log = log; hud(); renderHunt();
}
function win(log) {
  const h = hunt, drops = {};
  for (const p of h.def.parts) drops[p] = (drops[p] || 0) + 1 + (Math.random() < 0.5 ? 1 : 0);
  for (const k of Object.keys(h.parts)) if (h.parts[k].broken) { const p = h.def.parts[Math.floor(Math.random() * h.def.parts.length)]; drops[p] = (drops[p] || 0) + 1; }
  const gold = Math.round(h.lv * (15 + Math.random() * 10)), xp = 20 * h.lv;
  for (const [k, n] of Object.entries(drops)) S.inv[k] = (S.inv[k] || 0) + n;
  S.gold += gold; S.xp += xp; S.cool[h.id] = Date.now();
  let up = 0; while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.lv++; up++; }
  if (up) S.hp = maxHp();
  save(); hud(); refreshEntities(); hunt = null;
  openModal(`<h2>🏆 ล่าสำเร็จ!</h2><div class="big">${h.def.emoji}</div>
    <p class="log">${log.join('<br>')}</p>
    <h3>ของที่ได้</h3><div>${Object.entries(drops).map(([k, n]) => `${k} ×${n}`).join(' · ')}</div>
    <div class="row">💰 +${gold} ทอง · ⭐ +${xp} XP${up ? ` · <b>เลเวลอัป! Lv${S.lv}</b>` : ''}</div>
    <div class="row"><button class="primary" onclick="closeModal()">กลับไปแผนที่</button></div>`);
}
function lose(log) {
  const lost = Math.floor(S.gold * 0.1); S.gold -= lost; S.hp = Math.ceil(maxHp() / 2); hunt = null; save(); hud();
  openModal(`<h2>💀 ล่าไม่สำเร็จ</h2><p class="log">${log.join('<br>')}</p>
    <p>คุณสลบและถูกพากลับมา เสียทอง ${lost} แต่ไม่เสียของ</p>
    <div class="row"><button class="primary" onclick="closeModal()">กลับไปแผนที่</button></div>`);
}
function bar(cls, v, m) { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, v / m * 100))}%"></i></div>`; }
function renderHunt() {
  const h = hunt, w = weaponOf();
  const partRow = k => { const p = PARTS[k], st = h.parts[k];
    return `<span class="tag">${p.name}${h.def.weak === k ? ' ★' : ''}${st.broken ? ' 💥พัง' : ` ${Math.min(100, Math.round(st.dmg / (h.max * 0.3) * 100))}%`}</span>`; };
  openModal(`<h2>${h.def.name} Lv${h.lv}</h2><div class="big">${h.def.emoji}</div>
    ${bar('foe', h.hp, h.max)}<div class="muted" style="margin-top:4px">${h.hp}/${h.max} · จุดอ่อน ★ = ${PARTS[h.def.weak].name}</div>
    <div class="row">${['head', 'body', 'tail'].map(partRow).join(' · ')}</div>
    <div class="intent">${INTENT_TEXT[h.intent]}</div>
    <div class="log">${h.log.join('<br>')}</div>
    ${bar('', S.hp, maxHp())}<div class="muted" style="margin:4px 0 8px">HP ${S.hp}/${maxHp()} · ${w.emoji} ${w.name} (โจมตี ${w.atk})</div>
    <div class="grid">${['head', 'body', 'tail'].map(k => `<button class="primary" onclick="act('attack','${k}')">${w.emoji} ${PARTS[k].name}<br><small>${Math.round(w.acc * PARTS[k].acc * 100)}%</small></button>`).join('')}</div>
    <div class="grid" style="margin-top:8px"><button onclick="act('guard')">🛡️ ป้องกัน</button><button onclick="act('dodge')">💨 หลบ</button>
      <button onclick="act('potion')" ${S.potions ? '' : 'disabled'}>🧪 ยา ×${S.potions}</button></div>
    <div class="row"><button onclick="act('flee')">🏃 หนี (60%)</button></div>`, true);
}

// ───────────── กระเป๋า / ช่างตีเหล็ก / วิธีเล่น ─────────────
function openBag() {
  const parts = Object.entries(S.inv).filter(([, n]) => n > 0);
  openModal(`<h2>🎒 กระเป๋า</h2>
    <h3>วัตถุดิบ</h3><div>${parts.length ? parts.map(([k, n]) => `${k} ×${n}`).join(' · ') : '<span class="muted">ยังไม่มี ไปล่ามอนสเตอร์!</span>'}</div>
    <div class="row">🧪 ยาฟื้นพลัง ×${S.potions}</div>
    <h3>อาวุธ (แตะเพื่อเลือกใช้)</h3>
    <div class="grid2">${S.owned.map(id => { const w = WEAPONS[id];
      return `<button class="${S.weapon === id ? 'on' : ''}" onclick="equip('${id}')">${w.emoji} ${w.name}<br><small>โจมตี ${w.atk} · แม่น ${Math.round(w.acc * 100)}%</small></button>`; }).join('')}</div>
    <h3>เกราะ</h3><div>${S.armors.length ? S.armors.map(a => `${ARMORS[a].name} (ลดดาเมจ ${ARMORS[a].def * 100}%)`).join('<br>') : '<span class="muted">ยังไม่มี ตีได้ที่ช่างตีเหล็ก</span>'}</div>
    <div class="row"><button class="primary" onclick="closeModal()">ปิด</button></div>`);
}
function equip(id) { S.weapon = id; save(); openBag(); }
function have(cost) { return Object.entries(cost).every(([k, n]) => (S.inv[k] || 0) >= n); }
function openSmith() {
  openModal(`<h2>🔨 ช่างตีเหล็ก</h2><p class="muted">เอาชิ้นส่วนมอนสเตอร์มาตีอาวุธและเกราะ 💰 ${S.gold} ทอง</p>
    ${RECIPES.map(r => {
      const owned = r.type === 'weapon' ? S.owned.includes(r.id) : r.type === 'armor' ? S.armors.includes(r.id) : false;
      const name = r.name || (r.type === 'weapon' ? `${WEAPONS[r.id].emoji} ${WEAPONS[r.id].name} (โจมตี ${WEAPONS[r.id].atk})` : `🛡️ ${ARMORS[r.id].name} (ลดดาเมจ ${ARMORS[r.id].def * 100}%)`);
      const ok = !owned && S.gold >= r.gold && have(r.cost);
      return `<div class="row"><div class="grow"><b>${name}</b><div class="muted">${Object.entries(r.cost).map(([k, n]) => `${k} ${S.inv[k] || 0}/${n}`).join(' · ')} · 💰${r.gold}</div></div>
        <button ${ok ? 'class="primary"' : 'disabled'} onclick="craft('${r.id}')">${owned ? 'มีแล้ว' : 'สร้าง'}</button></div>`;
    }).join('')}
    <div class="row"><button onclick="closeModal()">ปิด</button></div>`);
}
function craft(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r || S.gold < r.gold || !have(r.cost)) return;
  S.gold -= r.gold; for (const [k, n] of Object.entries(r.cost)) S.inv[k] -= n;
  if (r.type === 'weapon') { S.owned.push(id); S.weapon = id; } else if (r.type === 'armor') S.armors.push(id); else S.potions++;
  save(); hud(); openSmith(); toast('สร้างสำเร็จ!');
}
function openHelp() {
  openModal(`<h2>🗺️ นักล่าอสูรแห่งเมือง</h2>
    <p>เดินบนแผนที่จริง (OpenStreetMap) เพื่อตามล่ามอนสเตอร์ แบบ Witcher: Monster Slayer ผสมการล่าแบบ Monster Hunter</p>
    <h3>วิธีเล่น</h3>
    <p>• เดิน: ลากจอยสติ๊กซ้ายล่าง (คอมพิวเตอร์ใช้ WASD หรือปุ่มลูกศร) หรือกด “GPS จริง” ถ้าจะออกไปเดินจริง<br>
    • แตะมอนสเตอร์ที่อยู่ใกล้ (ภายใน ${ENGAGE_M} ม.) เพื่อเริ่มล่า แตะ 🌿 เพื่อเก็บสมุนไพร<br>
    • ตอนล่า เลือกโจมตี หัว/ลำตัว/หาง: ★ คือจุดอ่อน (ดาเมจ ×1.5) ตีส่วนใดจนพังจะได้ของเพิ่มและมอนสเตอร์อ่อนลง<br>
    • อ่านท่าของมอนสเตอร์ก่อนเลือก: โจมตีธรรมดา → ป้องกัน/หลบ, รวบรวมพลัง → รอบหน้าโจมตีหนัก, เหนื่อยหอบ → รีบโจมตีแรง ๆ<br>
    • เอาชิ้นส่วนไปให้ช่างตีเหล็กสร้างอาวุธและเกราะ: ดาบ (สมดุล) · ค้อน (แรง แต่พลาดบ่อย มีโอกาสทำให้มึน) · ธนู (แม่น โดนโต้กลับเบา)</p>
    <p class="muted">ต้นแบบเกมส่วนตัว ตัวละครเป็นอีโมจิ ความเร็วเดินในเกมเร็วกว่าเดินจริงเพื่อให้เล่นสนุก ข้อมูลเซฟในเบราว์เซอร์นี้</p>
    <div class="row"><button class="primary" onclick="closeModal()">เข้าใจแล้ว</button>
    <button onclick="if(confirm('ล้างเซฟและเริ่มใหม่?')){localStorage.removeItem('${SAVE_KEY}');location.reload()}">เริ่มเกมใหม่</button></div>`);
}
$('btnBag').onclick = openBag; $('btnSmith').onclick = openSmith; $('btnHelp').onclick = openHelp;

// ───────────── ส่วนประกอบ UI ─────────────
let modalOpen = 0;
function openModal(html) { $('sheet').innerHTML = html; $('modal').style.display = 'block'; modalOpen = 1; }
function closeModal() { $('modal').style.display = 'none'; modalOpen = 0; if (hunt && !hunt.over) hunt = null; save(); }
let toastTimer = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 2600); }
function hud() {
  $('lvTag').textContent = `Lv ${S.lv}`; $('hpTag').textContent = `${S.hp}/${maxHp()}`;
  $('hpBar').style.width = Math.max(0, S.hp / maxHp() * 100) + '%'; $('xpBar').style.width = (S.xp / xpNeed() * 100) + '%';
  $('goldTag').textContent = `💰 ${S.gold}`;
}
hud(); refreshEntities(); requestAnimationFrame(frame);
if (!localStorage.getItem(SAVE_KEY + '-seen')) { try { localStorage.setItem(SAVE_KEY + '-seen', '1'); } catch (_) {} openHelp(); }
</script>
